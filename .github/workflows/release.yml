name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - run: cargo test --all
      - run: cargo build --release --all

      - name: empaquetar
        run: |
          mkdir dist
          copy target\release\rocketdebug.exe dist\
          copy target\release\rocketdebug-mcp.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: rocketdebug-windows
          path: dist
          if-no-files-found: error

      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$env:TAG" dist\rocketdebug.exe dist\rocketdebug-mcp.exe --title "$env:TAG" --generate-notes --latest
