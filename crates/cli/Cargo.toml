[package]
name = "rocketdebug-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI de rocket_debugger"

[[bin]]
name = "rocketdebug"
path = "src/main.rs"

[dependencies]
rocketdebug-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
