[package]
name = "rocketdebug-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI de rocket_debugger"

[[bin]]
name = "rocketdebug"
path = "src/main.rs"

[dependencies]
rocketdebug-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

[dev-dependencies]
# Solo para crear la `robot.db` sintetica del test de integracion de `review`: el
# comando abre las dbs con `rocketdebug_core::db::open_readonly` y nunca escribe,
# asi que el CLI no necesita SQL en su codigo de produccion.
rusqlite = { workspace = true }
base64 = { workspace = true }
